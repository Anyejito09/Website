<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSIT 1-C</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Times New Roman, sans-serif;
            font-weight: bold;
            background-color: #000000;
        }

        .header {
            background-color: #87ceeb;
            text-align: center;
            padding: 20px;
            width: 100%;
        }

        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 32px;
        }

        .sidebar {
            width: 250px;
            background-color: #333333; 
            min-height: calc(100vh - 72px);             
            padding: 20px;
            float: left;               
        }

        .sidebar h2 {
            color: #ffffff;
            background-color: #87ceeb;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            padding: 10px 15px;
            border-radius: 50px;
            font-size: 20px;
        }

        .sidebar ul {
            list-style-type: none;     
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            margin-bottom: 12px;
        }

        .sidebar a {
            display: block;           
            background-color: #555555; 
            color: #ffffff;            
            text-decoration: none;     
            padding: 12px 15px;
            border-radius: 8px;
        }

        .sidebar a:hover {
            background-color: #666666;
        }

        .content {
            background-image: url('homemiku.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
            
            color: #ffffff;
            margin-left: 250px;
            padding: 40px;
            min-height: calc(100vh - 72px);
        }

        .content h1 {
            margin-top: 0;
            font-size: 36px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Website BSIT 1-C</h1>
    </div>

    <div class="sidebar">
        <h2>[Kyle Estrellas]</h2>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="aboutme.html">About Me</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>

    <main class="content">
        <h1>Home</h1>
        <p>Hello this is the "home" of my website!, I hope you take a peek around, and try to take in what I am</p>
        <p>Nonetheless, please do have a nice day, and remember to be yourself</p>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSIT 1-C</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Times New Roman, sans-serif;
            font-weight: bold;
            background-color: #000000;
        }

        .header {
            background-color: #87ceeb;
            text-align: center;
            padding: 20px;
            width: 100%;
        }

        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 32px;
        }

        .sidebar {
            width: 250px;
            background-color: #333333; 
            min-height: calc(100vh - 72px);             
            padding: 20px;
            float: left;               
        }

        .sidebar h2 {
            color: #ffffff;
            background-color: #87ceeb;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            padding: 10px 15px;
            border-radius: 50px;
            font-size: 20px;
        }

        .sidebar ul {
            list-style-type: none;     
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            margin-bottom: 12px;
        }

        .sidebar a {
            display: block;           
            background-color: #555555; 
            color: #ffffff;            
            text-decoration: none;     
            padding: 12px 15px;
            border-radius: 8px;
        }

        .sidebar a:hover {
            background-color: #666666;
        }

        .main-container {
            margin-left: 250px;
            padding: 40px;
            min-height: calc(100vh - 72px);
            background-color: #000000;
        }

        .main-container h1 {
            color: #ffffff;
            margin-top: 0;
            font-size: 36px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            background-color: #2b2b2b;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            max-width: 300px;
        }

        .gallery-grid img {
            width: 100%;
            height: 180px;
            object-fit: cover; 
            display: block;
        }

        .image-caption {
            padding: 12px;
            font-size: 14px;
            color: #ffffff;
            text-align: center;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Website BSIT 1-C</h1>
    </div>

    <div class="sidebar">
        <h2>[Kyle Estrellas]</h2>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="aboutme.html">About Me</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>

    <div class="main-container">
        <h1>Gallery of Miku</h1>
        
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="images.jpg" alt="Gallery Photo 1">
                <p class="image-caption">Miku Explosion Background Super Cool Aura</p>
            </div>

            <div class="gallery-item">
                <img src="speedku.jpg" alt="Gallery Photo 2">
                <p class="image-caption">Please Speedku I NEED THIS</p>
            </div>
        </div>
    </div>

</body>
</html>
